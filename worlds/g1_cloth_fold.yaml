name: g1_cloth_fold             # 宇树 G1 双手叠毛毯：MuJoCo 4.0 柔性布料 + 灵巧手
timestep: 0.002
ctrl_period: 1                  # 布料的显式钉扎需要逐物理步施加，控制器按 tick 驱动
gravity: [0, 0, -9.81]
integrator: discrete            # flex 的 <elasticity> 在 implicit/implicitfast 下不隐式积分
impratio: 20
cone: elliptic

scene:
  floor:
    size: [3.0, 3.0]
    texture: grid
    friction: 1.0
  lights:
    - {pos: [0, 0, 3]}
    - {pos: [1.2, -1.0, 2.2]}
  cameras:
    # 演示机位：站在桌子右前方看机器人身前的前沿。叠毯动作发生在桌子靠机器
    # 人一侧（x≈0.22~0.43，z 0.75~0.95），原机位在桌子外侧会被桌面挡住。
    - name: showcase
      pos: [0.95, -1.10, 1.25]
      quat: [0.7752, 0.5710, 0.1602, 0.2175]
      fovy: 48
    # 桌面俯视机位：看折叠结果是否对齐
    - name: top
      pos: [0.52, 0.0, 1.55]
      euler: [0, 0, 0]
      fovy: 46
  objects:
    # 折叠台：顶面 z=0.75，前沿 x=0.22（桌板悬在脚趾上方，腿在 x≥0.27）
    - name: table
      type: box
      size: [0.25, 0.38, 0.02]
      pos: [0.47, 0, 0.73]
      color: "#6B7280"
      static: true
    - {name: table_leg_0, type: box, size: [0.02, 0.02, 0.365], pos: [0.27, -0.32, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_1, type: box, size: [0.02, 0.02, 0.365], pos: [0.67, -0.32, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_2, type: box, size: [0.02, 0.02, 0.365], pos: [0.27, 0.32, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_3, type: box, size: [0.02, 0.02, 0.365], pos: [0.67, 0.32, 0.365], color: "#4B5563", static: true}
    # 毛毯：0.26 × 0.40 m 柔性网格，质量 0.25 kg。整块布一半在桌上、
    # 近半幅探出桌沿 12cm 自然垂下，形成一个能真实捏住的竖直垂边（相当于
    # 叠毯子时手里那段布边）。桌面顶面 z=0.75，前沿 x=0.22。
    - name: blanket
      type: cloth
      size: [0.13, 0.20]
      pos: [0.23, 0, 0.757]
      cells: [10, 16]
      mass: 1.2
      thickness: 0.01
      young: 8000
      poisson: 0.3
      friction: 3.0
      color: "#D97757"

robots:
  - name: g1
    model: ../models/zoo/unitree_g1/g1_with_hands.xml
    pos: [0, 0, 0]
    # GUI 内直接运行：共享世界控制器在内核进程里推进（钉扎布料需要逐
    # 物理步写状态）。命令行独立跑/录视频用 python -m demo.cloth_folding.run
    controller: ../demo/cloth_folding/controller.py
    args:
      shared_world_controller: true

task:
  max_ticks: 9000

runtime:
  realtime: false
  controller_timeout: 600
  timeout_policy: last_ctrl
