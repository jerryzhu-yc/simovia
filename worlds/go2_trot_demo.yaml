name: go2_trot_demo          # Go2 行走 demo（与 zoo 生成物完全等价，只是控制器收进仓库）
# 源端对照：examples/sim2sim/mujoco_go2_trot.py —— 同一个 go2.xml、同一份 CPG
# 控制律（simovia/sim2sim/go2_trot.py），但用独立 mujoco 步进
timestep: 0.002
ctrl_period: 8               # 0.016s -> 62.5Hz，与 zoo demo 一致
gravity: [0, 0, -9.81]
impratio: 100                # Menagerie 四足原生摩擦比；默认 1 会放大地面对误差
integrator: implicitfast     # 高刚度接触必需，Euler 会数值弹跳

scene:
  floor:
    size: [15.0, 15.0]       # 半尺寸 15m：9.6s 走 6.5m，地面小了会跑出边界
    texture: grid
    friction: 0.8
  lights:
    - {pos: [0, 0, 3]}
  cameras:
    # 固定机位：同时覆盖源端(2.80,-1.76)与目标端(3.35,-1.27)的 4s 行走路径，
    # 两端世界必须逐位一致，否则对比视频没有可比性
    - name: showcase
      pos: [3.289, 3.618, 2.315]
      quat: [0.151214, 0.098413, 0.536518, 0.824377]
      fovy: 50

robots:
  - name: go2
    model: ../models/zoo/unitree_go2/go2.xml
    pos: [0, 0, 0.45]        # 出生贴地：直腿脚底 0.448 + 2mm 缓冲
    controller: ../controllers/go2_trot_sim2sim.py

task:
  max_ticks: 250             # 4s（sim2sim 目标域 200 tick 也是 4s）

runtime:
  realtime: false
  controller_timeout: 120
  timeout_policy: last_ctrl
