name: g1_cloth_policy_eval    # G1 双臂叠布 π0.5 策略闭环评估（与训练采集场景一致）
timestep: 0.004                # 与遥操作采集场景一致（策略按 31.25Hz 训练）
ctrl_period: 8                 # 32ms / tick
gravity: [0, 0, -9.81]
integrator: discrete           # flex 的 <elasticity> 在 implicit/implicitfast 下不隐式积分
impratio: 20
cone: elliptic

scene:
  floor:
    size: [3.0, 3.0]
    texture: grid
    friction: 1.0
  lights:
    - {pos: [0, 0, 3]}
    - {pos: [1.2, -1.0, 2.2]}
  cameras:
    # 与遥操作场景完全相同的第三人称机位：它就是训练集里的 cam_high，
    # 位置/朝向/视场一旦改动，策略看到的画面就偏离训练分布。
    - name: showcase
      pos: [0.95, -1.10, 1.25]
      quat: [0.7752, 0.5710, 0.1602, 0.2175]
      fovy: 48
  objects:
    - name: table
      type: box
      size: [0.25, 0.44, 0.02]
      pos: [0.47, 0, 0.73]
      color: "#6B7280"
      static: true
    - {name: table_leg_0, type: box, size: [0.02, 0.02, 0.365], pos: [0.27, -0.36, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_1, type: box, size: [0.02, 0.02, 0.365], pos: [0.67, -0.36, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_2, type: box, size: [0.02, 0.02, 0.365], pos: [0.27, 0.36, 0.365], color: "#4B5563", static: true}
    - {name: table_leg_3, type: box, size: [0.02, 0.02, 0.365], pos: [0.67, 0.36, 0.365], color: "#4B5563", static: true}
    - {name: bin_wall_x0, type: box, size: [0.010, 0.144, 0.0375], pos: [0.275, 0.26, 0.7875], color: "#4B5563", static: true}
    - {name: bin_wall_x1, type: box, size: [0.010, 0.144, 0.0375], pos: [0.485, 0.26, 0.7875], color: "#4B5563", static: true}
    - {name: bin_wall_y0, type: box, size: [0.099, 0.010, 0.0375], pos: [0.38, 0.110, 0.7875], color: "#4B5563", static: true}
    - {name: bin_wall_y1, type: box, size: [0.099, 0.010, 0.0375], pos: [0.38, 0.410, 0.7875], color: "#4B5563", static: true}
    # 布料初始位姿固定（不随机化）：先验证策略在训练分布中心能否复现抓取，
    # 后续要测泛化再把 args.randomize 打开。
    - name: blanket
      type: cloth
      size: [0.065, 0.11]
      pos: [0.40, -0.02, 0.756]
      cells: [10, 16]
      mass: 0.08
      thickness: 0.004
      young: 20000
      poisson: 0.3
      friction: 0.5
      self_collide: bvh
      color: "#D97757"

robots:
  - name: g1
    model: ../models/zoo/unitree_g1/g1_with_hands.xml
    pos: [0, 0, 0.79]
    end_effectors:
      - {model: robotiq_2f85, side: left, pos: [0, 0, -0.089]}
      - {model: robotiq_2f85, side: right, pos: [0, 0, -0.089]}
    # 共享控制器：锁浮动基座、逐物理步推进布料、逐 tick 渲染策略输入图
    controller: ../controllers/g1_cloth_policy_eval.py
    args:
      shared_world_controller: true
      # ---- π0.5 推理
      model: pi05_g1_cloth_lora
      checkpoint: ~/openpi/checkpoints/pi05_g1_cloth_lora/g1_cloth/30000
      python: ~/openpi/.venv/bin/python     # openpi 的 uv 环境（jax/flax）
      # cuda 下用平台分配器（按需分配/归还），仿真加载后仅剩 ~8G 也能稳定跑
      device: cuda
      mem_fraction: 0.66                     # 平台分配器下不生效，保留仅作参考
      # 50 步：平台分配器下实测连续 6 次推理稳定（首次含编译 3.8s，之后 ~0.37s）
      num_steps: 50
      ticks_per_action: 1                    # 每个预测动作重复的 tick 数；1=严格 31.25Hz 回放
      prompt: put the blanket in the box     # 必须与训练数据集 task 一致
      # ---- 场景/渲染（与采集一致）
      task: put the blanket in the box
      dataset: ~/桌面/g1_cloth_policy_eval_dataset   # 仅基类初始化用，不写帧
      port: 8093                                     # 基类初始化用，随即关闭
      cam_size: 256
      arms: left                                     # 训练数据是单臂（左臂活动）
      control: osc
      scale: 0.45
      grasp: true
      # ---- 评估判定
      max_sim_seconds: 30                # 仿真时间上限（约 940 tick）
      success_hold_seconds: 0.5
      # z 上限压在盒口（0.825）以下：布料必须真的落进盒内，悬在盒口上方不算
      success_box: {min: [0.285, 0.120, 0.745], max: [0.475, 0.400, 0.790]}
      grip_release_threshold: 0.2        # 两侧夹爪开度都低于此值才算松手
      worker_log: /tmp/pi05_worker.log
    sensors:
      # 与遥操作采集场景逐字段一致：训练集里的 cam_left_wrist
      - name: cam_left_wrist
        type: camera
        body: gripper_left/base
        pos: [-0.062, 0.02, 0.0]
        quat: [-0.14573, 0.703, 0.69193, -0.07611]
        fovy: 85
      - name: cam_right_wrist
        type: camera
        body: gripper_right/base
        pos: [0.06197, 0.0203, -0.00029]
        quat: [-0.14192, 0.70389, -0.69141, 0.07972]
        fovy: 85

task:
  max_ticks: 1000000            # 实际结束由控制器判定（成功/超时）

runtime:
  realtime: false               # 推理本身是瓶颈，不再按墙钟 sleep
  controller_timeout: 600       # 首次推理含 XLA 编译
  timeout_policy: last_ctrl
