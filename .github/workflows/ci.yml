name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"          # Windows 默认代码页会让中文日志/文件解析乱码
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Linux：MuJoCo 离屏渲染（EGL/OSMesa）；Windows 用系统自带的 WGL
      - name: 安装渲染系统库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libosmesa6 libgl1 libegl1 libglew2.2

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 环境诊断（含渲染/模型资产/样例世界编译）
        run: python -m simovia doctor --json
        env:
          MUJOCO_GL: ${{ runner.os == 'Linux' && 'osmesa' || 'wgl' }}

      # 分两批跑：GUI/遥操作进程类用例单独一批，避免长进程与仿真用例互相拖死
      # Linux 用 OSMesa 软件渲染（已装 libosmesa6），渲染类用例照常执行；
      # Windows 运行器没有 OpenGL 3.3 驱动，gl 标记的用例由 tests/conftest.py
      # 隔子进程探测后自动跳过（渲染相关能力由 doctor 步骤报告）。
      - name: 回归测试（核心）
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --ignore=tests/test_gui.py --ignore=tests/test_teleop.py
        env:
          PYTHONPATH: .
          MUJOCO_GL: ${{ runner.os == 'Linux' && 'osmesa' || 'wgl' }}
          SIMOVIA_CTRL_TRACE: "1"   # 临时：定位 Windows 控制器握手超时
          SIMOVIA_CTRL_TRACE_FILE: ${{ runner.temp }}/ctrl_trace.log

      - name: 回归测试（GUI / 遥操作）
        run: >
          python -m pytest tests/test_gui.py tests/test_teleop.py
          -q -p no:cacheprovider
        env:
          PYTHONPATH: .
          MUJOCO_GL: ${{ runner.os == 'Linux' && 'osmesa' || 'wgl' }}
